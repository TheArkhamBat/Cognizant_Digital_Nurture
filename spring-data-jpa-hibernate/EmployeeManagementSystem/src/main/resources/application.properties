server.port=8091

# ---------------------------------------------------------------
# Exercise 1: primary datasource (used by JPA/Hibernate)
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------------------------------------------------------------
# Exercise 10: Hibernate dialect + batch processing properties
# ---------------------------------------------------------------
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ---------------------------------------------------------------
# Exercise 9: independent secondary datasource, wired up manually in
# SecondaryDataSourceConfig.java and accessed via JdbcTemplate (not JPA)
# ---------------------------------------------------------------
app.datasource.secondary.url=jdbc:h2:mem:auditdb
app.datasource.secondary.driver-class-name=org.h2.Driver
app.datasource.secondary.username=sa
app.datasource.secondary.password=password
